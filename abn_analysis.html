<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>異常履歴解析ツール</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Noto Sans JP",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#1f2937}
    header{background:#0f172a;color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    h1{font-size:1.35rem;margin:0;font-weight:800}
    main{padding:18px;max-width:1480px;margin:0 auto}
    button{border:0;border-radius:6px;padding:10px 14px;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}
    button.secondary{background:#475569}
    button.ghost{background:#fff;color:#0f172a;border:1px solid #cbd5e1}
    button:disabled{opacity:.55;cursor:not-allowed}
    .header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .user-chip{font-size:.86rem;background:rgba(255,255,255,.12);padding:7px 10px;border-radius:6px}
    .auth-card{max-width:420px;margin:10vh auto;background:#fff;padding:22px;border-radius:8px;box-shadow:0 10px 28px rgba(15,23,42,.16)}
    .auth-card h2{margin:0 0 14px;color:#0f172a;font-size:1.15rem}
    .auth-card input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:6px;margin:6px 0 10px;font-size:1rem}
    .error{color:#b91c1c;font-size:.9rem;margin-top:8px;min-height:20px}
    .filters{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:14px;display:grid;grid-template-columns:repeat(7,minmax(132px,1fr));gap:12px;align-items:end;margin-bottom:16px}
    .field label{display:block;font-size:.78rem;font-weight:800;color:#475569;margin-bottom:5px}
    .field input,.field select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;font-size:.95rem}
    .field select[multiple]{height:118px;padding:6px}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px;margin-bottom:16px}
    .metric{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:13px}
    .metric .label{font-size:.78rem;color:#64748b;font-weight:800}
    .metric .value{font-size:1.65rem;font-weight:900;margin-top:4px;color:#0f172a}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .panel{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:14px;min-width:0}
    .panel h2{font-size:1rem;margin:0 0 10px;color:#0f172a;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .hint{font-size:.75rem;color:#64748b;font-weight:600}
    .chart-wrap{height:360px;position:relative;overflow:auto}
    .svg-chart{width:100%;min-width:720px;height:330px;display:block}
    .svg-chart rect{cursor:pointer}
    .svg-chart rect:hover{opacity:.78}
    .svg-axis{stroke:#cbd5e1;stroke-width:1}
    .svg-label{fill:#475569;font-size:11px}
    .details{margin-top:16px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:14px}
    .details h2{font-size:1.05rem;margin:0 0 10px;color:#0f172a}
    .table-wrap{overflow:auto;max-height:560px;border:1px solid #e2e8f0;border-radius:6px}
    table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:1180px}
    th,td{padding:9px 10px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}
    th{position:sticky;top:0;background:#f8fafc;z-index:1;color:#334155;font-size:.78rem}
    .photo-strip{display:flex;gap:6px;min-width:120px}
    .photo-strip img{width:42px;height:42px;object-fit:cover;border-radius:5px;border:1px solid #cbd5e1;cursor:pointer}
    .badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:.72rem;font-weight:800;background:#e0f2fe;color:#075985}
    .badge.mold{background:#fee2e2;color:#991b1b}
    .empty{padding:24px;text-align:center;color:#64748b}
    @media (max-width:1200px){.filters{grid-template-columns:repeat(4,1fr)}}
    @media (max-width:900px){.filters{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:700px){header{align-items:flex-start}.filters{grid-template-columns:1fr}.summary{grid-template-columns:1fr}main{padding:10px}.chart-wrap{height:320px}}
  </style>
</head>
<body>
  <header>
    <h1>異常履歴解析ツール</h1>
    <div class="header-actions">
      <span class="user-chip" id="userChip">未ログイン</span>
      <button class="ghost" id="btnOpenInput">入力アプリ</button>
      <button class="secondary" id="btnSignOut" style="display:none;">ログアウト</button>
    </div>
  </header>
  <main>
    <section class="auth-card" id="authGate">
      <h2>ログイン</h2>
      <input type="email" id="authEmail" placeholder="user@example.com" autocomplete="username">
      <input type="password" id="authPassword" placeholder="パスワード" autocomplete="current-password">
      <button id="btnLogin" style="width:100%;">ログイン</button>
      <p class="error" id="authMsg"></p>
    </section>
    <section id="appRoot" style="display:none;">
      <div class="filters">
        <div class="field"><label>開始月</label><input type="month" id="monthFrom"></div>
        <div class="field"><label>終了月</label><input type="month" id="monthTo"></div>
        <div class="field"><label>部署（複数選択可）</label><select id="departmentFilter" multiple size="5"></select></div>
        <div class="field"><label>保全単位フィルター</label><select id="maintenanceFilter"><option value="all">すべて</option><option value="mold">金型トラブル（保全単位あり）</option><option value="nonMold">金型以外（保全単位なし）</option></select></div>
        <div class="field"><label>内訳グラフの縦軸</label><select id="breakdownMetric"><option value="count">件数</option><option value="stop">停止時間</option></select></div>
        <div class="field"><label>表示する整理No数</label><select id="topN"><option value="8">上位8件</option><option value="12" selected>上位12件</option><option value="20">上位20件</option><option value="9999">すべて</option></select></div>
        <div class="field"><button id="btnRefresh" style="width:100%;">再読み込み</button></div>
      </div>
      <div class="summary">
        <div class="metric"><div class="label">対象件数</div><div class="value" id="metricCount">0</div></div>
        <div class="metric"><div class="label">停止時間合計</div><div class="value" id="metricStop">0分</div></div>
        <div class="metric"><div class="label">金型トラブル</div><div class="value" id="metricMold">0</div></div>
        <div class="metric"><div class="label">金型以外</div><div class="value" id="metricNonMold">0</div></div>
      </div>
      <div class="grid">
        <section class="panel"><h2>月ごと・部署ごとの異常件数 <span class="hint">棒をクリックで詳細</span></h2><div class="chart-wrap" id="countChart"></div></section>
        <section class="panel"><h2>月ごと・部署ごとの異常停止時間 <span class="hint">棒をクリックで詳細</span></h2><div class="chart-wrap" id="stopChart"></div></section>
        <section class="panel"><h2>整理Noごとのライン別内訳 <span class="hint">横軸: 整理No</span></h2><div class="chart-wrap" id="lineChart"></div></section>
        <section class="panel"><h2>整理Noごとの部署別内訳 <span class="hint">横軸: 整理No</span></h2><div class="chart-wrap" id="serialChart"></div></section>
      </div>
      <section class="details"><h2 id="detailTitle">詳細一覧</h2><div class="table-wrap" id="detailTable"></div></section>
    </section>
  </main>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js';
    import { getFirestore, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js';

    const firebaseConfig = { apiKey: "AIzaSyA0YUIpIDh4WB4p1ewiNB0XfwHve0ByljU", authDomain: "abnreport-fd733.firebaseapp.com", databaseURL: "https://abnreport-fd733-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "abnreport-fd733", storageBucket: "abnreport-fd733.firebasestorage.app", messagingSenderId: "349748947315", appId: "1:349748947315:web:010cb671d2a95bcf1f7d06" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let allRows = [];

    const els = {
      authGate: q('authGate'), appRoot: q('appRoot'), userChip: q('userChip'), authMsg: q('authMsg'),
      monthFrom: q('monthFrom'), monthTo: q('monthTo'), departmentFilter: q('departmentFilter'), maintenanceFilter: q('maintenanceFilter'),
      breakdownMetric: q('breakdownMetric'), topN: q('topN'), detailTitle: q('detailTitle'), detailTable: q('detailTable')
    };

    q('btnOpenInput').addEventListener('click', () => location.href = 'abnreport.html');
    q('btnSignOut').addEventListener('click', () => signOut(auth));
    q('btnRefresh').addEventListener('click', loadData);
    [els.monthFrom, els.monthTo, els.departmentFilter, els.maintenanceFilter, els.breakdownMetric, els.topN].forEach(el => el.addEventListener('change', renderAll));
    q('btnLogin').addEventListener('click', async () => {
      els.authMsg.textContent = '';
      try {
        await setPersistence(auth, browserLocalPersistence);
        await signInWithEmailAndPassword(auth, q('authEmail').value.trim(), q('authPassword').value);
      } catch (error) {
        els.authMsg.textContent = 'ログインに失敗しました: ' + (error.code || error.message);
      }
    });

    onAuthStateChanged(auth, async user => {
      if (!user) {
        els.authGate.style.display = '';
        els.appRoot.style.display = 'none';
        q('btnSignOut').style.display = 'none';
        els.userChip.textContent = '未ログイン';
        return;
      }
      els.authGate.style.display = 'none';
      els.appRoot.style.display = '';
      q('btnSignOut').style.display = '';
      els.userChip.textContent = user.email || user.uid;
      await loadData();
    });

    function q(id) { return document.getElementById(id); }
    function selectedValues(select) { return Array.from(select.selectedOptions).map(o => o.value).filter(Boolean); }
    function toMonth(value) { const raw = String(value || '').trim(); return /^\d{4}-\d{2}/.test(raw) ? raw.slice(0, 7) : '日付なし'; }
    function calcStopMinutes(item) {
      const ot = item.occurrenceTime || '', rt = item.restartTime || '';
      if (!ot || !rt) return 0;
      const [oh, om] = ot.split(':').map(Number), [rh, rm] = rt.split(':').map(Number);
      if ([oh, om, rh, rm].some(Number.isNaN)) return 0;
      let diff = (rh * 60 + rm) - (oh * 60 + om);
      if (diff < 0) diff += 1440;
      return diff;
    }
    function normalizeRow(id, data) {
      const maintenanceUnit = String(data.maintenanceUnit || '').trim();
      return { _id: id, ...data, month: toMonth(data.occurrenceDate), department: String(data.department || '部署未入力').trim() || '部署未入力', lineName: String(data.lineName || 'ライン未入力').trim() || 'ライン未入力', serialNo: String(data.serialNo || '整理No未入力').trim() || '整理No未入力', maintenanceUnit, troubleType: maintenanceUnit ? 'mold' : 'nonMold', stopMinutes: calcStopMinutes(data), photoUrls: [...(data.mfgPhotoUrls || []), ...(data.techPhotoUrls || [])] };
    }
    async function loadData() {
      q('btnRefresh').disabled = true;
      try {
        const snap = await getDocs(query(collection(db, 'anomalies'), orderBy('createdAt', 'desc')));
        allRows = snap.docs.map(d => normalizeRow(d.id, d.data() || {}));
        initializeFilters();
        renderAll();
      } catch (error) {
        console.error(error);
        els.detailTable.innerHTML = `<div class="empty">データ取得に失敗しました: ${escapeHtml(error.code || error.message)}</div>`;
      } finally {
        q('btnRefresh').disabled = false;
      }
    }
    function initializeFilters() {
      const months = Array.from(new Set(allRows.map(r => r.month).filter(m => m !== '日付なし'))).sort();
      if (months.length && !els.monthFrom.value) els.monthFrom.value = months[0];
      if (months.length && !els.monthTo.value) els.monthTo.value = months[months.length - 1];
      const selected = selectedValues(els.departmentFilter);
      const departments = Array.from(new Set(allRows.map(r => r.department))).sort((a, b) => a.localeCompare(b, 'ja'));
      els.departmentFilter.innerHTML = departments.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
      Array.from(els.departmentFilter.options).forEach(option => option.selected = selected.length ? selected.includes(option.value) : true);
    }
    function getFilteredRows() {
      const from = els.monthFrom.value || '', to = els.monthTo.value || '', departments = selectedValues(els.departmentFilter), trouble = els.maintenanceFilter.value;
      return allRows.filter(row => (!from || row.month === '日付なし' || row.month >= from) && (!to || row.month === '日付なし' || row.month <= to) && (!departments.length || departments.includes(row.department)) && (trouble === 'all' || row.troubleType === trouble));
    }
    function renderAll() {
      const rows = getFilteredRows();
      updateMetrics(rows);
      renderCountChart(rows);
      renderStopChart(rows);
      renderSerialAxisBreakdown(rows, 'lineName', 'lineChart', 'ライン別内訳');
      renderSerialAxisBreakdown(rows, 'department', 'serialChart', '部署別内訳');
      renderDetails(rows, '現在のフィルター条件の詳細一覧');
    }
    function updateMetrics(rows) {
      q('metricCount').textContent = rows.length.toLocaleString();
      q('metricStop').textContent = rows.reduce((sum, r) => sum + r.stopMinutes, 0).toLocaleString() + '分';
      q('metricMold').textContent = rows.filter(r => r.troubleType === 'mold').length.toLocaleString();
      q('metricNonMold').textContent = rows.filter(r => r.troubleType === 'nonMold').length.toLocaleString();
    }
    function monthDeptKeys(rows) { return { months: Array.from(new Set(rows.map(r => r.month))).sort(), departments: Array.from(new Set(rows.map(r => r.department))).sort((a, b) => a.localeCompare(b, 'ja')) }; }
    function metricValue(row) { return els.breakdownMetric.value === 'stop' ? row.stopMinutes : 1; }
    function metricUnit() { return els.breakdownMetric.value === 'stop' ? '分' : '件'; }
    function renderCountChart(rows) {
      const { months, departments } = monthDeptKeys(rows);
      const datasets = departments.map((dept, idx) => ({ label: dept, data: months.map(month => rows.filter(r => r.month === month && r.department === dept).length), color: palette(idx) }));
      makeSvgChart('countChart', months, datasets, '件', (month, dept) => renderDetails(rows.filter(r => r.month === month && r.department === dept), `異常件数: ${month} / ${dept}`));
    }
    function renderStopChart(rows) {
      const { months, departments } = monthDeptKeys(rows);
      const datasets = departments.map((dept, idx) => ({ label: dept, data: months.map(month => rows.filter(r => r.month === month && r.department === dept).reduce((sum, r) => sum + r.stopMinutes, 0)), color: palette(idx) }));
      makeSvgChart('stopChart', months, datasets, '分', (month, dept) => renderDetails(rows.filter(r => r.month === month && r.department === dept), `停止時間: ${month} / ${dept}`));
    }
    function renderSerialAxisBreakdown(rows, field, chartId, title) {
      const topN = Number(els.topN.value || 12);
      const serialTotals = new Map();
      rows.forEach(row => serialTotals.set(row.serialNo, (serialTotals.get(row.serialNo) || 0) + metricValue(row)));
      const serials = Array.from(serialTotals.entries()).sort((a, b) => b[1] - a[1]).slice(0, topN).map(([serial]) => serial);
      const groups = Array.from(new Set(rows.map(r => r[field]))).sort((a, b) => a.localeCompare(b, 'ja'));
      const datasets = groups.map((group, idx) => ({
        label: group,
        data: serials.map(serial => rows.filter(r => r.serialNo === serial && r[field] === group).reduce((sum, r) => sum + metricValue(r), 0)),
        color: palette(idx)
      }));
      makeSvgChart(chartId, serials, datasets, metricUnit(), (serial, group) => renderDetails(rows.filter(r => r.serialNo === serial && r[field] === group), `${title}: 整理No ${serial} / ${group}`));
    }
    function makeSvgChart(chartId, labels, datasets, unit, onClick) {
      const wrap = q(chartId);
      wrap.innerHTML = '';
      if (!labels.length || !datasets.length) { wrap.innerHTML = '<div class="empty">該当データがありません</div>'; return; }
      const svgNs = 'http://www.w3.org/2000/svg', width = Math.max(720, labels.length * 76), height = 330, margin = { top: 16, right: 18, bottom: 70, left: 52 };
      const plotW = width - margin.left - margin.right, plotH = height - margin.top - margin.bottom;
      const totals = labels.map((_, i) => datasets.reduce((sum, ds) => sum + Number(ds.data[i] || 0), 0));
      const maxValue = Math.max(1, ...totals), barW = Math.max(20, Math.min(48, plotW / labels.length - 16));
      const svg = document.createElementNS(svgNs, 'svg');
      svg.setAttribute('class', 'svg-chart'); svg.setAttribute('viewBox', `0 0 ${width} ${height}`); svg.setAttribute('role', 'img');
      addLine(svg, margin.left, margin.top, margin.left, margin.top + plotH); addLine(svg, margin.left, margin.top + plotH, width - margin.right, margin.top + plotH);
      [0, .5, 1].forEach(rate => { const y = margin.top + plotH - plotH * rate; addLine(svg, margin.left - 4, y, width - margin.right, y); addText(svg, 8, y + 4, Math.round(maxValue * rate).toLocaleString() + unit); });
      labels.forEach((label, labelIdx) => {
        const x = margin.left + (plotW / labels.length) * labelIdx + (plotW / labels.length - barW) / 2;
        let stacked = 0;
        datasets.forEach(ds => {
          const value = Number(ds.data[labelIdx] || 0);
          if (!value) return;
          const y = margin.top + plotH - (plotH * (stacked + value) / maxValue), h = Math.max(1, plotH * value / maxValue);
          const rect = document.createElementNS(svgNs, 'rect');
          rect.setAttribute('x', x); rect.setAttribute('y', y); rect.setAttribute('width', barW); rect.setAttribute('height', h); rect.setAttribute('fill', ds.color || '#2563eb');
          rect.addEventListener('click', () => onClick(label, ds.label));
          const tip = document.createElementNS(svgNs, 'title'); tip.textContent = `${label} / ${ds.label}: ${value.toLocaleString()}${unit}`;
          rect.appendChild(tip); svg.appendChild(rect); stacked += value;
        });
        const axisLabel = addText(svg, x + barW / 2, height - 24, label);
        axisLabel.setAttribute('text-anchor', 'end'); axisLabel.setAttribute('transform', `rotate(-35 ${x + barW / 2} ${height - 24})`);
      });
      wrap.appendChild(svg);
    }
    function addLine(svg, x1, y1, x2, y2) { const line = document.createElementNS('http://www.w3.org/2000/svg', 'line'); line.setAttribute('x1', x1); line.setAttribute('y1', y1); line.setAttribute('x2', x2); line.setAttribute('y2', y2); line.setAttribute('class', 'svg-axis'); svg.appendChild(line); return line; }
    function addText(svg, x, y, text) { const node = document.createElementNS('http://www.w3.org/2000/svg', 'text'); node.setAttribute('x', x); node.setAttribute('y', y); node.setAttribute('class', 'svg-label'); node.textContent = text; svg.appendChild(node); return node; }
    function palette(index) { const colors = ['#2563eb','#dc2626','#16a34a','#ca8a04','#7c3aed','#0891b2','#ea580c','#475569','#be185d','#4d7c0f','#0f766e','#9333ea']; return colors[index % colors.length]; }
    function renderDetails(rows, title) {
      els.detailTitle.textContent = `${title}（${rows.length}件）`;
      if (!rows.length) { els.detailTable.innerHTML = '<div class="empty">該当データがありません</div>'; return; }
      const sorted = [...rows].sort((a, b) => (b.occurrenceDate || '').localeCompare(a.occurrenceDate || ''));
      els.detailTable.innerHTML = `<table><thead><tr><th>写真</th><th>発生日</th><th>部署</th><th>ライン</th><th>整理No</th><th>停止</th><th>区分</th><th>保全単位</th><th>異常内容</th><th>現場対応</th><th>処置方法</th></tr></thead><tbody>${sorted.map(row => `<tr><td>${renderPhotos(row.photoUrls)}</td><td>${escapeHtml(row.occurrenceDate || '')}<br>${escapeHtml(row.occurrenceTime || '')}</td><td>${escapeHtml(row.department)}</td><td>${escapeHtml(row.lineName)}</td><td>${escapeHtml(row.serialNo)}</td><td>${row.stopMinutes ? row.stopMinutes + '分' : '-'}</td><td><span class="badge ${row.troubleType === 'mold' ? 'mold' : ''}">${row.troubleType === 'mold' ? '金型' : '金型以外'}</span></td><td>${escapeHtml(row.maintenanceUnit || '-')}</td><td>${escapeHtml(row.anomalyContent || '-')}</td><td>${escapeHtml(row.actionTaken || '-')}</td><td>${escapeHtml(row.rootCauseAction || '-')}</td></tr>`).join('')}</tbody></table>`;
    }
    function renderPhotos(urls = []) { if (!urls.length) return '-'; return `<div class="photo-strip">${urls.slice(0, 3).map(url => `<img src="${escapeHtml(url)}" onclick="window.open('${escapeJs(url)}','_blank')" alt="写真">`).join('')}</div>`; }
    function escapeHtml(value) { return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function escapeJs(value) { return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
  </script>
</body>
</html>
